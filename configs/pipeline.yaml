# One source of truth for the pipeline. Paths are relative to the repo root.
# Env overrides: GODSEYE_DATA_DIR (replaces paths.data_dir), FIRMS_MAP_KEY.
display_name: F.I.R.E.S.

paths:
  data_dir: data            # raw/ and processed/ live under it
  archive_dir: C:/Users/muham/Downloads/NASA_FIRE_DATA  # FIRMS zips: MODIS 2000-2011 (yearly by country) + global downloads 2012-2025, read in place
  models_dir: models
  frontend_dir: frontend          # v0 Leaflet dashboard, served at /
  web_dir: web                    # our calendar app (ADR 0003), served at /app/
  figures_dir: reports/figures   # small committed PNG/SVG for README and slides

clean:
  min_confidence: nominal   # low | nominal | high
  grid_deg: 0.25
  recent_days: 7
  chunk_rows: 1000000
  table_format: feather     # ADR 0002: feather/zstd, not parquet

# Sensors (glossary: one instrument on one satellite). `satellite` is the canonical name written by `clean`.
# start/end = first/last day the sensor delivers FIRMS data (null = take it from the data).
sensors:
  Terra-MODIS:   {satellite: Terra,     instrument: MODIS, start: 2000-11-01, end: null}
  Aqua-MODIS:    {satellite: Aqua,      instrument: MODIS, start: 2002-07-04, end: null}
  S-NPP-VIIRS:   {satellite: Suomi-NPP, instrument: VIIRS, start: 2012-01-20, end: 2026-11-02}
  NOAA-20-VIIRS: {satellite: NOAA-20,   instrument: VIIRS, start: null,       end: null}
  NOAA-21-VIIRS: {satellite: NOAA-21,   instrument: VIIRS, start: null,       end: null}   # FIRMS archive from 2023-03-01

# `godseye ingest-archive` (ticket 07): one pass over the global archive zips (one sensor-year each)
archive:
  aois: [levant, argentina]   # multi-year AOI stores; nested AOIs (jordan) are served from their parent
  chunk_rows: 500000

aggregate:
  fine_deg: 0.01            # fire cell-day unit (~1 km); the coarse grid is clean.grid_deg
  partial_fraction: 0.2     # global day < this x the sensor's 31-day median -> "partial" coverage
  cross_sensor_fraction: 0.85  # day's ratio to same-instrument peers < this x its 31-day median -> "partial"
  cross_sensor_instruments: [VIIRS]  # not MODIS: Terra and Aqua pass at different times of day, so their daily
                                     # ratio is too noisy (the check flagged ~20% of MODIS days in 2026)

# Cross-sensor harmonization (ADR 0001). Each link maps `source` onto `target`'s scale.
harmonize:
  metric: n_fire_cells      # fire cell-days; detections are harmonized the same way when asked
  region_deg: 10            # region blocks for the region x month candidate and for cross-validation
  links:
    - {source: NOAA-20-VIIRS, target: S-NPP-VIIRS, provisional: false,
       note: "VIIRS continuity: same instrument, same orbit plane, no orbit drift; fitted on the whole overlap"}
    - {source: NOAA-21-VIIRS, target: S-NPP-VIIRS, provisional: false,
       note: "VIIRS continuity: same instrument, same orbit plane, no orbit drift; fitted on the whole overlap"}
    - {source: S-NPP-VIIRS, target: Aqua-MODIS, provisional: true, window: [2013, 2021],
       note: "Headline link (ADR 0001): fitted on 2013-2021, Aqua's original orbit (ticket 08); provisional only when just 2026 is available"}
  # The calendar's harmonized series: VIIRS in S-NPP units (first sensor in `viirs_priority` with full data that day,
  # converted with the links above), mapped to the headline target.
  headline:
    target: Aqua-MODIS
    label: Aqua-equivalent (Aqua-MODIS, afternoon overpass)
    observed_until: 2021-12-31   # ADR 0001: Aqua observed is the headline until its orbit drifts
    reference: S-NPP-VIIRS
    viirs_priority: [S-NPP-VIIRS, NOAA-20-VIIRS, NOAA-21-VIIRS]
    figure_aois: [levant, argentina]   # headline figure (README, slides, video)
    observed_from: 2003-01-01   # Aqua's first full year; Terra and 2000-2002 are shown per sensor ("By sensor") only
    switch_after: 2011          # headline figure: the real switch, S-NPP VIIRS comes online in January 2012

climatology:
  # ADR 0006 (amendment ACCEPTED 2026-11-14, before multi-year data was merged): "relative" = a week is active at
  # >= 10% of the AOI's peak weekly median (never below 1 fire cell-day); "absolute" = >= 1 fire cell-day (original).
  activity: relative

risk:
  grid_deg: 0.25
  horizon_days: 7
  min_history_days: 30
  risk_bins: [0.10, 0.30, 0.50, 0.70]
  risk_labels: [low, moderate, high, very_high, extreme]
  step_days: 7
  val_weeks: 6
  n_estimators: 600
  serve: v2.1                                # which model the risk endpoints serve: v1 (migrated pickle), v2 or v2.1
                                             # (v2.1 kept on 2026-11-14 by the validation rule in risk_v2.v21_model_dir)
  model_dir: risk_v1                        # under models/: model.txt + model_meta.json (native, no pickle)
  legacy_model_file: gods_eye_risk_model.pkl  # v1 pickle, migrated once into model_dir
  predictions_file: risk_predictions.csv

# Risk model v2 (ADRs 0004, 0005): NOAA-20 reference label/features, three blocks separated by the horizon.
risk_v2:
  model_dir: risk_v2
  v21_model_dir: risk_v21     # candidate v2.1: + NOAA-20 2019-2025 weekly climatology feature; kept only if it beats
                              # v2 on the validation block (Brier score, decided before the test block is scored)
  reference_sensor: NOAA-20-VIIRS
  step_days: 7
  min_history_days: 30
  train_end: 2026-08-21
  validation: [2026-08-28, 2026-09-25]
  test: [2026-10-02, 2026-10-30]
  n_estimators: 600

api:
  tile_cache: 8               # multi-year box stores kept in memory (LRU)
  tile_max_rows: 30000000     # a larger box falls back to the 2026 global store
  host: 127.0.0.1
  port: 8000
