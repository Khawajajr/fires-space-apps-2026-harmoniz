# One source of truth for the pipeline. Paths are relative to the repo root.
# Env overrides: GODSEYE_DATA_DIR (replaces paths.data_dir), FIRMS_MAP_KEY.
display_name: F.I.R.E.S.

paths:
  data_dir: data            # raw/ and processed/ live under it
  models_dir: models
  frontend_dir: frontend          # v0 Leaflet dashboard, served at /
  web_dir: web                    # our calendar app (ADR 0003), served at /app/
  figures_dir: reports/figures   # small committed PNG/SVG for README and slides

clean:
  min_confidence: nominal   # low | nominal | high
  grid_deg: 0.25
  recent_days: 7
  chunk_rows: 1000000
  table_format: feather     # ADR 0002: feather/zstd, not parquet

# Sensors (glossary: one instrument on one satellite). `satellite` is the canonical name written by `clean`.
# start/end = first/last day the sensor delivers FIRMS data (null = take it from the data).
sensors:
  Terra-MODIS:   {satellite: Terra,     instrument: MODIS, start: 2000-11-01, end: null}
  Aqua-MODIS:    {satellite: Aqua,      instrument: MODIS, start: 2002-07-04, end: null}
  S-NPP-VIIRS:   {satellite: Suomi-NPP, instrument: VIIRS, start: 2012-01-20, end: 2026-11-02}
  NOAA-20-VIIRS: {satellite: NOAA-20,   instrument: VIIRS, start: null,       end: null}
  NOAA-21-VIIRS: {satellite: NOAA-21,   instrument: VIIRS, start: 2024-01-17, end: null}

aggregate:
  fine_deg: 0.01            # fire cell-day unit (~1 km); the coarse grid is clean.grid_deg
  partial_fraction: 0.2     # global day < this x the sensor's 31-day median -> "partial" coverage
  cross_sensor_fraction: 0.85  # day's ratio to same-instrument peers < this x its 31-day median -> "partial"
  cross_sensor_instruments: [VIIRS]  # not MODIS: Terra and Aqua pass at different times of day, so their daily
                                     # ratio is too noisy (the check flagged ~20% of MODIS days in 2026)

# Cross-sensor harmonization (ADR 0001). Each link maps `source` onto `target`'s scale.
harmonize:
  metric: n_fire_cells      # fire cell-days; detections are harmonized the same way when asked
  region_deg: 10            # region blocks for the region x month candidate and for cross-validation
  links:
    - {source: NOAA-20-VIIRS, target: S-NPP-VIIRS, provisional: false,
       note: "VIIRS continuity: same instrument, same orbit plane, no orbit drift; S-NPP read low in Oct 2026"}
    - {source: NOAA-21-VIIRS, target: S-NPP-VIIRS, provisional: false,
       note: "VIIRS continuity: same instrument, same orbit plane, no orbit drift; S-NPP read low in Oct 2026"}

risk:
  grid_deg: 0.25
  horizon_days: 7
  min_history_days: 30
  risk_bins: [0.10, 0.30, 0.50, 0.70]
  risk_labels: [low, moderate, high, very_high, extreme]
  step_days: 7
  val_weeks: 6
  n_estimators: 600
  model_file: gods_eye_risk_model.pkl
  predictions_file: risk_predictions.csv

api:
  host: 127.0.0.1
  port: 8000
